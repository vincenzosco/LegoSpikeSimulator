[project]
name = "lego-spike-simulator"
version = "0.1.0"
description = "Simulatore del robot LEGO Education SPIKE Prime con GUI PyQt5"
requires-python = ">=3.10"
dependencies = ["PyQt5>=5.15"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["spikesim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning:pytest_asyncio.*",
]
